databaseChangeLog:
  - changeSet:
      id: 09-create-shopping_carts-table
      author: BelitskyiOleksandr
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shopping_carts
            baseColumnNames: id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_shopping_cart_user